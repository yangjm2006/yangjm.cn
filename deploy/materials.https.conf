server {
    server_name materials.yangjm.cn;
    root /var/lib/yangjm-materials/current;
    index index.html;
    charset utf-8;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "no-cache" always;

    location / { try_files $uri $uri/ =404; }
    location /files/ {
        alias /var/lib/yangjm-materials/objects/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "sandbox" always;
    }
    location ~ /\. { deny all; }
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/yangjm-materials-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/materials.yangjm.cn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/materials.yangjm.cn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = materials.yangjm.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name materials.yangjm.cn;
    return 404; # managed by Certbot


}