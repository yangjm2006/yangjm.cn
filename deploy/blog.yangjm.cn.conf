server {
    server_name blog.yangjm.cn;
    root /var/www/yangjm.cn;
    index index.html;
    charset utf-8;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "no-cache" always;

    location = / {
        expires -1;
        try_files /blog/index.html =404;
    }

    location / {
        try_files /blog$uri /blog$uri/index.html $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/blog.yangjm.cn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/blog.yangjm.cn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = blog.yangjm.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name blog.yangjm.cn;
    return 404; # managed by Certbot
}
