server {
    listen 80;
    server_name oi.yangjm.cn;
    root /var/www/yangjm.cn;
    charset utf-8;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    location = / { try_files /oi/index.html =404; }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
}
server {
    listen 80;
    server_name banzi.yangjm.cn;
    root /var/www/yangjm.cn;
    charset utf-8;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    location = / { try_files /banzi/index.html =404; }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
}
