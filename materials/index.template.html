<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f1e8"><meta name="description" content="OI 与 ACM 学习资料、集训课件和国家队论文集。"><title>学习资料 · yangjm</title><script>
    (() => {
      const key = 'yangjm-theme';
      const valid = value => value === 'light' || value === 'dark';
      const readCookie = () => {
        const item = document.cookie.split('; ').find(row => row.startsWith(`${key}=`));
        return item ? decodeURIComponent(item.slice(key.length + 1)) : null;
      };
      const save = theme => {
        const sharedDomain = location.hostname === 'yangjm.cn' || location.hostname.endsWith('.yangjm.cn');
        const domain = sharedDomain ? '; Domain=yangjm.cn' : '';
        const secure = location.protocol === 'https:' ? '; Secure' : '';
        document.cookie = `${key}=${theme}; Path=/; Max-Age=31536000; SameSite=Lax${domain}${secure}`;
        try { localStorage.setItem(key, theme); } catch {}
      };
      let legacy;
      try { legacy = localStorage.getItem(key); } catch {}
      const cookie = readCookie();
      const saved = valid(cookie) ? cookie : (valid(legacy) ? legacy : null);
      if (!valid(cookie) && valid(legacy)) save(legacy);
      const hour = new Date().getHours();
      const theme = saved || (hour >= 7 && hour < 19 ? 'light' : 'dark');
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
      document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#15231d' : '#f4f1e8';
      window.YANGJM_THEME = { read: readCookie, save, valid };
    })();
  </script><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/styles.css?v=20260916"><link rel="stylesheet" href="/subsites.css?v=20260916"><link rel="stylesheet" href="/materials.css?v=2"><script src="/materials.js?v=2" defer></script><script src="/subsites.js?v=20260916" defer></script><link rel="stylesheet" href="/navigation.css?v=20260921a"></head><body class="subsite materials-page"><a class="skip-link" href="#content">跳到正文</a>{{SITE_HEADER}}<main id="content" class="materials-main">
